version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      all-npm-dependencies:
        patterns:
          - "*"
    # typescript-eslint 8.67 supports TypeScript versions below 6.1.
    # Remove this once TypeScript 7 support is released.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      all-github-actions:
        patterns:
          - "*"
